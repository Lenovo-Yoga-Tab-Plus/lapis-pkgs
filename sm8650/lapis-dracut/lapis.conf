i18n_vars="/etc/locale.conf /etc/vconsole.conf"
# Image builds run inside a chroot on a loop disk; never bake that disk UUID.
hostonly="no"
# The boot partition is about 224 MB. The disk and display drivers are
# built into the kernel, so the initramfs does not need every module or
# every firmware blob.
omit_dracutmodules+=" firmware kernel-modules kernel-modules-extra kernel-network-modules bluetooth crypt dm lvm mdraid multipath nfs nbd iscsi fcoe fips cifs qemu qemu-net hwdb resume "
