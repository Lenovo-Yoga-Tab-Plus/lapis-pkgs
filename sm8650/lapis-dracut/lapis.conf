i18n_vars="/etc/locale.conf /etc/vconsole.conf"
# Image builds run inside a chroot on a loop disk; never bake that disk UUID.
hostonly="no"
# The disk and the panel are built into the kernel. Installing drivers
# in the initramfs takes minutes and leaves every other device down.
no_kernel="yes"
omit_dracutmodules+=" firmware kernel-modules kernel-modules-extra kernel-network-modules bluetooth crypt systemd-cryptsetup dm lvm mdraid multipath nfs nbd iscsi fcoe fips cifs qemu qemu-net hwdb resume qcom-adsp devicetree-firmware "
