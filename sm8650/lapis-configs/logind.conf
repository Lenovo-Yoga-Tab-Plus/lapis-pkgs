[Login]
# The folio Hall line is still SW_LID. It is not verified, so a closed cover
# must not suspend the tablet. The power key and idle do.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandlePowerKey=suspend
HandleSuspendKey=suspend
IdleAction=suspend
IdleActionSec=15min
