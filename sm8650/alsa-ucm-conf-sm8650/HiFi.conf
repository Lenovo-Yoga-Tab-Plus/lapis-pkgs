SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Include.wcde.File "/codecs/wcd939x/DefaultEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	# Android leaves the crossover in the Awinic ACF profile and runs every
	# amplifier at 0 dB. 1023 is that setting. The DSP stream gain is
	# Q13 (8192 = 0 dB); 16384 is +6 dB, which is what matches Android
	# at the top of the volume slider. The control name is truncated
	# to ALSA's 43-character limit.
	EnableSequence [
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 16384"
		cset "name='Amp0 PCM Playback Volume' 1023"
		cset "name='Amp1 PCM Playback Volume' 1023"
		cset "name='Amp2 PCM Playback Volume' 1023"
		cset "name='Amp3 PCM Playback Volume' 1023"
		cset "name='Amp4 PCM Playback Volume' 1023"
		cset "name='Amp5 PCM Playback Volume' 1023"
	]

	DisableSequence [
		cset "name='Amp0 PCM Playback Volume' 0"
		cset "name='Amp1 PCM Playback Volume' 0"
		cset "name='Amp2 PCM Playback Volume' 0"
		cset "name='Amp3 PCM Playback Volume' 0"
		cset "name='Amp4 PCM Playback Volume' 0"
		cset "name='Amp5 PCM Playback Volume' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}


SectionDevice."Headphones" {
	Comment "Headphones"

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP Digital"
		JackControl "Headphone Jack"
	}
}

# Android's speaker-mic and handset-mic paths enable AMIC1 and AMIC4
# together, in ADC_LP, with ADC volume 12 and the decimator at 0 dB.
# On this board those mics are SWR_MIC0 and SWR_MIC2. The capture device
# is only opened while something is recording.
SectionDevice."Mic1" {
	Comment "Internal Microphones"

	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 12"
		cset "name='TX0 MODE' ADC_LP"

		cset "name='ADC3_MIXER Switch' 1"
		cset "name='ADC3 MUX' CH3_AMIC4"
		cset "name='ADC3 Switch' 1"
		cset "name='ADC3 Volume' 12"
		cset "name='TX2 MODE' ADC_LP"

		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"

		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC2"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
		cset "name='ADC3 MUX' CH3_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		ConflictingDevice "Mic2"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	Include.wcdmice.File "/codecs/wcd939x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd939x/HeadphoneMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic1EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	# Drop the internal-mic right channel when the headset mic takes over.
	EnableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC3 MUX' CH3_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 300
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
		JackHWMute "Mic1"
		JackHWMute "Mic2"
	}
}

SectionDevice."Mic2" {
	Comment "Back Microphone"

	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 MUX' CH1_AMIC4"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 12"
		cset "name='TX0 MODE' ADC_LP"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		ConflictingDevice "Mic1"
	}
}
