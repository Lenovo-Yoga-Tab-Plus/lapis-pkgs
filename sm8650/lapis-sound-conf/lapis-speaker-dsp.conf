# Static Dolby speaker_landscape curve, plus the part that keeps it clean
# when the volume is high. Android's +3 dB volmax sits behind a limiter;
# without one, the +6 dB DSP stream gain clips and the speakers rattle.
# The limiter ceiling is -9 dB, so the +6 dB DSP gain still leaves about
# 3 dB before the amps clip. The 100 Hz highpass and the smaller bass shelf
# keep the drivers out of the rattle Dolby's regulator suppresses. Speakers only.

wireplumber.profiles = {
  main = {
    filter.sink.lapis-speaker = required
  }
}

wireplumber.components = [
  {
    name = libpipewire-module-filter-chain, type = pw-module-client
    arguments = {
      node.description = "Speaker processing"
      media.name = "Speaker processing"
      filter.graph = {
        nodes = [
          {
            type = builtin name = tone label = param_eq
            config = {
              filters = [
                { type = bq_highpass freq = 100.0 q = 0.707 gain = 0.0 }
                { type = bq_lowshelf freq = 264.0 q = 0.707 gain = 1.0 }
                { type = bq_peaking freq = 400.0 q = 1.0 gain = -2.0 }
                { type = bq_peaking freq = 47.0 q = 0.90 gain = -4.125 }
                { type = bq_peaking freq = 141.0 q = 1.41 gain = 0.938 }
                { type = bq_peaking freq = 234.0 q = 2.45 gain = 1.688 }
                { type = bq_peaking freq = 328.0 q = 2.85 gain = 0.750 }
                { type = bq_peaking freq = 469.0 q = 2.89 gain = -3.688 }
                { type = bq_peaking freq = 656.0 q = 3.46 gain = -7.0 }
                { type = bq_peaking freq = 844.0 q = 4.47 gain = -1.25 }
                { type = bq_peaking freq = 1313.0 q = 4.04 gain = 1.0 }
                { type = bq_peaking freq = 1688.0 q = 3.67 gain = 1.5 }
                { type = bq_peaking freq = 2250.0 q = 3.47 gain = -1.062 }
                { type = bq_peaking freq = 3000.0 q = 3.97 gain = -1.938 }
                { type = bq_peaking freq = 3750.0 q = 4.47 gain = -2.562 }
                { type = bq_peaking freq = 4688.0 q = 4.56 gain = -1.0 }
                { type = bq_peaking freq = 7125.0 q = 4.53 gain = -5.75 }
                { type = bq_peaking freq = 9000.0 q = 4.38 gain = -10.0 }
                { type = bq_peaking freq = 11250.0 q = 4.63 gain = -12.5 }
                { type = bq_peaking freq = 13875.0 q = 3.44 gain = -9.438 }
                { type = bq_peaking freq = 19688.0 q = 3.60 gain = -5.5 }
              ]
            }
          }
          {
            type = ladspa
            name = lim
            plugin = fast_lookahead_limiter_1913
            label = fastLookaheadLimiter
            control = {
              "Input gain (dB)" = 0.0
              "Limit (dB)" = -9.0
              "Release time (s)" = 0.05
            }
          }
        ]
        links = [
          { output = "tone:Out 1" input = "lim:Input 1" }
          { output = "tone:Out 2" input = "lim:Input 2" }
        ]
        inputs = [ "tone:In 1" "tone:In 2" ]
        outputs = [ "lim:Output 1" "lim:Output 2" ]
      }
      audio.channels = 2
      audio.position = [ FL, FR ]
      capture.props = {
        node.name = "effect_output.lapis-speaker"
        media.class = "Audio/Sink"
        filter.smart = true
        filter.smart.name = "filter.sink.lapis-speaker"
        filter.smart.target = "{ \"node.name\" = \"alsa_output.platform-sound.HiFi__Speaker__sink\" }"
      }
      playback.props = {
        node.name = "effect_input.lapis-speaker"
        node.passive = true
        node.dont-fallback = true
        media.role = "DSP"
      }
    }
    provides = filter.sink.lapis-speaker
    requires = [ support.client-context ]
  }
]
