# WirePlumber gives the internal mic and the headset mic the same priority
# because they share one PCM device. Android switches to the headset mic
# when the jack is plugged in.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.platform-sound.HiFi__Headset__source" }
    ]
    actions = {
      update-props = {
        priority.session = 1900
        priority.driver  = 1900
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        # Volume-key clicks reuse the open playback path instead of
        # power-cycling all six amplifiers.
        session.suspend-timeout-seconds = 20
      }
    }
  }
]
