[Service]
# iio-sensor-proxy 3.9 owns its bus name before it opens the SSC sensors, and
# a Claim that lands in between is recorded but never starts the sensor.
# lapis-autobright claims the light sensor in that window at every boot, so
# the brightness curve read 0 lux until the proxy restarted. This build of
# 3.9 starts a claimed sensor once it is open.
ExecStart=
ExecStart=/usr/lib/lapis/iio-sensor-proxy
